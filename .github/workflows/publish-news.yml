name: Hourly News Publishing Pipeline

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  publish:
    name: Run Gemini Newsroom
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Publishing Endpoint
        run: |
          response=$(curl -s -w "\n%{http_code}" -X GET "https://tradeflock-usa-nine.vercel.app/api/cron/publish" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")

          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n 1)

          echo "Response Body: $body"
          echo "Status Code: $status"

          if [ "$status" -ne 200 ]; then
            echo "Publish pipeline returned non-200 status code"
            exit 1
          fi
