name: Newsroom Pipeline (legacy, manual only)

# Phase 0 (2026-10-07): the 15-minute schedule is removed. The wire no longer
# publishes. In WIRE_MODE=signals (production default) this endpoint only writes
# signal cards; in WIRE_MODE=publish it saves drafts only. Scheduled intake is
# .github/workflows/signal-desk.yml.
on:
  workflow_dispatch:

jobs:
  publish:
    name: Run legacy wire endpoint (no publishing)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Trigger endpoint
        run: |
          response=$(curl -s -w "\n%{http_code}" -m 310 -X GET "https://tradeflock-usa-nine.vercel.app/api/cron/publish" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")
          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n 1)
          echo "Response Body: $body"
          echo "Status Code: $status"
          if [ "$status" -ne 200 ]; then exit 1; fi
