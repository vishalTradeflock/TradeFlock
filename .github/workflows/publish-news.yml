name: Newsroom Pipeline

on:
  schedule:
    # 24/7 — every day, every hour, every 15 minutes.
    # GitHub Actions cron is UTC; this fires around the clock in every timezone.
    # Use workflow_dispatch for a one-off run. No Vercel cron.
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  publish:
    name: Run Gemini Newsroom
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Trigger Publishing Endpoint
        run: |
          response=$(curl -s -w "\n%{http_code}" -m 310 -X GET "https://tradeflock-usa-nine.vercel.app/api/cron/publish" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}")

          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n 1)

          echo "Response Body: $body"
          echo "Status Code: $status"

          if [ "$status" -ne 200 ]; then
            echo "Publish pipeline returned non-200 status code"
            exit 1
          fi
