name: Cover Backfill (one image per story)

# Manual dispatch, plus an hourly run at :23 UTC. The route already has the
# Supabase service-role and Unsplash env; this workflow only needs the existing
# CRON_SECRET repo secret. Dispatch is a dry run unless "apply" is ticked.
# Scheduled runs apply, 100 stories, one round. Inputs are empty on schedule,
# so those defaults live in the env expressions. Source photos run before
# Unsplash and do not use its hourly quota; the route stops at ~270s.
# A rate-limit stoppedReason exits 0. When remaining is 0 the scheduled run
# is a single cheap no-op call.
on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Write changes (unticked = dry run)"
        type: boolean
        default: false
      limit:
        description: "Stories per call (max 100). Manual apply uses this; default 100."
        default: "100"
      rounds:
        description: "Calls to make (apply mode stops early when nothing is left)"
        default: "1"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Run cover backfill
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APPLY: ${{ github.event_name == 'schedule' && '1' || (inputs.apply && '1' || '0') }}
          LIMIT: ${{ github.event_name == 'schedule' && '100' || inputs.limit }}
          ROUNDS: ${{ github.event_name == 'schedule' && '1' || inputs.rounds }}
        run: |
          for round in $(seq 1 "$ROUNDS"); do
            response=$(curl -s -w "\n%{http_code}" -m 310 \
              "https://tradeflock-usa-nine.vercel.app/api/cron/dedupe-covers?apply=${APPLY}&limit=${LIMIT}&redoNameQueries=${APPLY}" \
              -H "Authorization: Bearer ${CRON_SECRET}")
            body=$(echo "$response" | sed '$d')
            status=$(echo "$response" | tail -n 1)
            echo "Round $round — HTTP $status"
            echo "$body"
            stopped=$(echo "$body" | jq -r '.stoppedReason // empty' 2>/dev/null || true)
            if echo "$stopped" | grep -qi "rate limit"; then
              echo "Unsplash rate limit — exiting 0 so the next scheduled run can continue."
              exit 0
            fi
            if [ "$status" -ne 200 ]; then exit 1; fi
            remaining=$(echo "$body" | jq -r '.remaining // 0')
            if [ "$APPLY" != "1" ] || [ "$remaining" = "0" ] || [ -n "$stopped" ]; then break; fi
          done
